<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="700" viewBox="0 0 1560 700" role="img" aria-labelledby="title desc">
  <title id="title">Maquettes du parcours DéclaSinistre</title>
  <desc id="desc">Trois écrans desktop : saisie progressive, récapitulatif modifiable et confirmation avec suivi local.</desc>
  <defs>
    <style>
      .bg{fill:#f3f7f6}.card{fill:#fff;stroke:#dce7e4;stroke-width:1.5}.navy{fill:#173442}.teal{fill:#087e78}.muted{fill:#71848a}.soft{fill:#edf5f2}.line{stroke:#dce7e4;stroke-width:1.3}.label{font:600 12px Arial,sans-serif;fill:#526970}.body{font:14px Arial,sans-serif;fill:#233d47}.small{font:11px Arial,sans-serif;fill:#6e8287}.title{font:700 20px Arial,sans-serif;fill:#153440}.h2{font:700 16px Arial,sans-serif;fill:#153440}.brand{font:700 13px Arial,sans-serif;fill:#173442}.white{fill:#fff}.button{font:700 12px Arial,sans-serif;fill:#fff}.step{font:11px Arial,sans-serif;fill:#53686e}.kicker{font:700 10px Arial,sans-serif;fill:#0c7b73;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1560" height="700" class="bg"/>
  <text x="44" y="45" class="kicker">DÉCLASINISTRE · UX / MAQUETTES DE RÉFÉRENCE</text>
  <text x="44" y="76" class="title">Un parcours guidé, un récapitulatif contrôlable, une confirmation explicite</text>
  <text x="44" y="101" class="small">Cas fictif · Les écrans ci-dessous documentent le prototype statique livré.</text>

  <!-- Screen 1 -->
  <g transform="translate(44,130)">
    <rect width="468" height="520" rx="16" class="card"/>
    <rect width="468" height="46" rx="16" class="white"/>
    <text x="24" y="29" class="brand">◈  DéclaSinistre</text>
    <rect x="330" y="12" width="116" height="25" rx="13" fill="#fbf5e8" stroke="#eadcb9"/>
    <text x="342" y="29" class="small" fill="#7d632b">DÉMO FICTIVE</text>
    <text x="24" y="83" class="kicker">DÉCLARATION EN LIGNE · ENVIRON 5 MIN</text>
    <text x="24" y="113" class="title">Commençons par vous</text>
    <text x="24" y="137" class="title">identifier</text>
    <text x="24" y="162" class="small">Utilisez uniquement les données de démonstration.</text>
    <rect x="24" y="183" width="420" height="67" rx="9" class="soft"/>
    <circle cx="47" cy="207" r="13" fill="#0a7d76"/><text x="43" y="211" class="button">1</text>
    <text x="68" y="205" class="step">Identification</text><text x="68" y="222" class="small">Circonstances  ·  Justificatifs  ·  Récapitulatif</text>
    <text x="24" y="283" class="label">Nom de démonstration</text>
    <rect x="24" y="292" width="420" height="40" rx="7" class="white" stroke="#cad8d5"/>
    <text x="37" y="317" class="body">Camille Martin</text>
    <text x="24" y="357" class="label">Référence du contrat</text>
    <rect x="24" y="366" width="420" height="40" rx="7" class="white" stroke="#cad8d5"/>
    <text x="37" y="391" class="body">DEMO-0001</text>
    <text x="24" y="427" class="small">Aucune vérification de contrat réel n’est effectuée.</text>
    <rect x="24" y="454" width="420" height="43" rx="8" class="teal"/>
    <text x="183" y="481" class="button">Continuer →</text>
  </g>

  <!-- Screen 2 -->
  <g transform="translate(546,130)">
    <rect width="468" height="520" rx="16" class="card"/>
    <text x="24" y="30" class="brand">◈  DéclaSinistre</text>
    <text x="24" y="76" class="kicker">ÉTAPE 4 SUR 5</text>
    <text x="24" y="106" class="title">Vérifiez votre déclaration</text>
    <text x="24" y="129" class="small">Vous pouvez revenir corriger une information avant de confirmer.</text>
    <rect x="24" y="151" width="420" height="265" rx="10" fill="#fbfcfc" stroke="#dce7e4"/>
    <text x="42" y="179" class="small">NOM</text><text x="42" y="199" class="body">Camille Martin</text>
    <line x1="42" y1="211" x2="426" y2="211" class="line"/>
    <text x="42" y="233" class="small">CONTRAT DE DÉMONSTRATION</text><text x="42" y="253" class="body">DEMO-0001</text>
    <line x1="42" y1="265" x2="426" y2="265" class="line"/>
    <text x="42" y="287" class="small">CIRCONSTANCES</text><text x="42" y="307" class="body">Dégât des eaux accidentel</text>
    <text x="42" y="330" class="small">DESCRIPTION</text><text x="42" y="350" class="body">Une fuite fictive est apparue sous l’évier.</text>
    <line x1="42" y1="362" x2="426" y2="362" class="line"/>
    <text x="42" y="385" class="small">ORIENTATION SIMULÉE</text><text x="42" y="403" class="body">Qualification par un gestionnaire</text>
    <rect x="24" y="431" width="420" height="48" rx="8" fill="#f0f7f4" stroke="#d9e9e4"/>
    <text x="40" y="451" class="small">En continuant, vous créez une confirmation fictive</text>
    <text x="40" y="467" class="small">dans ce navigateur. Aucun dossier n’est transmis.</text>
    <rect x="24" y="490" width="130" height="18" rx="8" fill="#fff" stroke="#cad8d5"/>
    <text x="59" y="503" class="small">← Précédent</text>
    <rect x="260" y="486" width="184" height="30" rx="7" class="teal"/>
    <text x="282" y="506" class="button">Confirmer la simulation</text>
  </g>

  <!-- Screen 3 -->
  <g transform="translate(1048,130)">
    <rect width="468" height="520" rx="16" class="card"/>
    <text x="24" y="30" class="brand">◈  DéclaSinistre</text>
    <circle cx="234" cy="111" r="29" fill="#e4f3ed" stroke="#b8ddd0"/>
    <path d="M221 111l9 9 18-21" fill="none" stroke="#087e78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="169" class="kicker">SIMULATION TERMINÉE</text>
    <text x="91" y="201" class="title">Votre déclaration est prête</text>
    <text x="70" y="226" class="small">Aucun gestionnaire réel n’a reçu cette déclaration.</text>
    <rect x="24" y="251" width="420" height="148" rx="10" fill="#fbfcfc" stroke="#dce7e4"/>
    <text x="43" y="279" class="small">RÉFÉRENCE DE DÉMONSTRATION</text>
    <text x="43" y="302" class="body">DS-DEMO-638576</text>
    <line x1="43" y1="315" x2="425" y2="315" class="line"/>
    <text x="43" y="340" class="small">STATUT</text>
    <rect x="43" y="351" width="155" height="27" rx="13" fill="#e7f3ee"/>
    <text x="56" y="369" class="small" fill="#17695c">Déposé — simulation locale</text>
    <rect x="24" y="420" width="420" height="58" rx="9" fill="#f0f7f4" stroke="#d9e9e4"/>
    <text x="42" y="445" class="body">Suivi disponible dans ce navigateur</text>
    <text x="42" y="463" class="small">La référence et le statut restent locaux.</text>
    <rect x="24" y="492" width="420" height="18" rx="8" fill="#fff" stroke="#cad8d5"/>
    <text x="148" y="505" class="small">Suivre une déclaration · Recommencer</text>
  </g>
</svg>
